<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuse logo grid — loop</title>
<script>if(self!==top)document.documentElement.classList.add('embed')</script>
<style>
  :root { --ground:#BCFAF2; --main:#131313; --second:#666666; --accent:#FF8000; }
  html, body { margin:0; height:100%; background:var(--ground); }
  /* Embedded in the case study, the page stays transparent until it plays, so
     the still underneath shows through; then it fades in over it. With
     reduced motion it shows its finished frame as soon as that is drawn. */
  html.embed, html.embed body { background:transparent; }
  body { display:flex; align-items:center; justify-content:center; }
  .fuse-loop { width:100%; max-width:100vw; max-height:100vh; aspect-ratio:16/9; opacity:0; transition:opacity .4s; }
  .ready.played .fuse-loop { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .ready .fuse-loop { opacity:1; } }
  .fuse-loop svg { display:block; width:100%; height:100%; }
  .gl { fill:none; stroke:color-mix(in srgb, var(--second) 62%, var(--ground)); stroke-width:0.9; stroke-dasharray:6 7; }
  .gl-frame { stroke:color-mix(in srgb, var(--second) 70%, var(--ground)); stroke-width:1.1; }
  .gl-diag { stroke:color-mix(in srgb, var(--second) 50%, var(--ground)); }
  .dots { fill:color-mix(in srgb, var(--second) 42%, var(--ground)); }
  .mark { fill:var(--accent); }
  .logo { fill:var(--main); stroke:var(--main); stroke-width:4.5; stroke-linejoin:round; }
  .trace { fill:none; stroke:var(--main); stroke-width:0.9; stroke-linejoin:round; }
  .arc { fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round; }
  .note { font-family:Inter, system-ui, sans-serif; font-size:26px; letter-spacing:.06em; fill:var(--second); }
</style>
</head>
<body>
<div class="fuse-loop" id="fuse-loop" role="img" aria-label="Fuse logo drawing onto a construction grid, looping"></div>
<script>
(() => {
  // ---- timing ----
  const ANIM = 4.0;      // the animation itself (seconds)
  const HOLD = 0.8;      // hold on the finished frame
  const FADE = 0.5;      // fade everything out before restarting
  const PRE  = 0.4;      // lines start slightly "before" 0, as in the film
  const PERIOD = PRE + ANIM + HOLD + FADE;

  // ---- easing ----
  const clamp01 = x => Math.min(1, Math.max(0, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3);
  const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const eob = (x, s = 1.4) => x <= 0 ? 0 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);

  // ---- geometry (1920x1080 viewBox) ----
  const GS = 1.8, GOX = 614, GOY = 399, GK = 0.7;
  const GP = (x, y) => [960 + GS * (x - GOX), 540 + GS * (y - GOY)];
  const BARS = [[327, 482, 574, 793], [390, 436, 572, 748]];
  const barD = ([y, l, s, r]) => {
    const p = [[l, y + 81], [l + 31, y + 37], [s, y + 37], [s + 26, y], [r, y], [r - 31, y + 44], [s + 22, y + 44], [s - 4, y + 81]];
    const R = [9, 8, 14, 14, 9, 8, 14, 14], n = p.length, f = v => v.toFixed(2);
    let d = '';
    for (let i = 0; i < n; i++) {
      const P = p[i];
      const cut = Q => { const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy); return [P[0] + dx / L * R[i], P[1] + dy / L * R[i]]; };
      const a = cut(p[(i + n - 1) % n]), c = cut(p[(i + 1) % n]);
      d += (i ? ' L' : 'M') + f(a[0]) + ' ' + f(a[1]) + ' Q' + P[0] + ' ' + P[1] + ' ' + f(c[0]) + ' ' + f(c[1]);
    }
    return d + ' Z';
  };
  const L = 639.6, R = 1282.2, T = 410.4, B = 669.6;
  const FRAME = [[60, 60, 1860, 60], [1860, 60, 1860, 1020], [1860, 1020, 60, 1020], [60, 1020, 60, 60]];
  const GRID = [[L, 1020, L, 60], [R, 60, R, 1020], [60, T, 1860, T], [1860, B, 60, B]];
  const DIAG = [[436, 471], [598, 390], [600, 327], [748, 390], [793, 327]].map(([x, y]) => {
    const [px, py] = GP(x, y);
    return [px + (py - 1100) * GK, 1100, px + (py + 20) * GK, -20];
  });
  const MARKS = [[60, T], [60, B], [1860, T], [1860, B]];

  // ---- build ----
  const ln = c => `<line class="${c}"/>`;
  const fade = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#fl-fade)"/>`;
  document.getElementById('fuse-loop').innerHTML =
    `<svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"><defs>
      <pattern id="fl-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="dots" cx="8" cy="8" r="1.5"/></pattern>
      <radialGradient id="fl-fade"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#888"/><stop offset="1" stop-color="#000"/></radialGradient>
      <mask id="fl-mask">${fade(210, 250, 330)}${fade(1700, 860, 360)}${fade(1640, 170, 210)}${fade(300, 930, 240)}</mask>
      <clipPath id="fl-clip"><rect x="60" y="60" width="1800" height="960"/></clipPath>
    </defs>
    <rect width="1920" height="1080" fill="var(--ground)"/>
    <g id="fl-all">
      <g id="fl-dots"></g>
      <g id="fl-grid">
        ${FRAME.map(() => ln('gl gl-frame fl-f')).join('')}
        ${GRID.map(() => ln('gl fl-l')).join('')}
        <g clip-path="url(#fl-clip)">${DIAG.map(() => ln('gl gl-diag fl-d')).join('')}</g>
      </g>
      <g transform="translate(960 540) scale(1.8) translate(-614 -399)">
        ${BARS.map(b => `<g class="fl-bar"><path class="logo fl-fill" d="${barD(b)}"/></g>`).join('')}
        ${BARS.map(b => `<path class="trace fl-tr" pathLength="1" stroke-dasharray="1 1" d="${barD(b)}"/>`).join('')}
      </g>
      ${MARKS.map(([x, y]) => `<g transform="translate(${x} ${y})"><rect class="mark fl-mk" x="-6" y="-6" width="12" height="12"/></g>`).join('')}
      <path class="arc" id="fl-arc" pathLength="1" stroke-dasharray="1 1" d="M1372.2 410.4 A90 90 0 0 0 1333.8 336.7"/>
      <text class="note" id="fl-note" x="1392" y="364">55°</text>
    </g></svg>`;

  const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
  const fr = $$('.fl-f'), gr = $$('.fl-l'), dg = $$('.fl-d');
  [[fr, FRAME], [gr, GRID], [dg, DIAG]].forEach(([els, Ls]) => els.forEach((el, i) => { el.setAttribute('x1', Ls[i][0]); el.setAttribute('y1', Ls[i][1]); }));
  const mk = $$('.fl-mk'), tr = $$('.fl-tr'), fill = $$('.fl-fill'), bar = $$('.fl-bar');
  const all = $('#fl-all'), grid = $('#fl-grid'), dots = $('#fl-dots'), arc = $('#fl-arc'), note = $('#fl-note');

  const draw = (els, Ls, t, t0, step, dur) => els.forEach((el, i) => {
    const p = eio(seg(t, t0 + i * step, t0 + i * step + dur)), l = Ls[i];
    el.setAttribute('x2', lerp(l[0], l[2], p)); el.setAttribute('y2', lerp(l[1], l[3], p));
    el.style.opacity = p > 0.002 ? 1 : 0;
  });

  // ---- render: pure function of t (seconds into the animation) ----
  function render(t, out) {
    draw(fr, FRAME, t, -0.4, 0.08, 0.9);
    draw(gr, GRID, t, 0.15, 0.1, 0.8);
    draw(dg, DIAG, t, 0.5, 0.09, 0.75);
    grid.style.opacity = lerp(1, 0.55, eio(seg(t, 2.4, 3.2)));
    dots.style.opacity = eo(seg(t, -0.4, 1.4)) * 0.45;
    mk.forEach((el, i) => el.setAttribute('transform', `scale(${Math.max(0, eob(seg(t, 0.9 + i * 0.08, 1.25 + i * 0.08), 1.7))})`));
    tr.forEach((el, i) => {
      el.style.strokeDashoffset = 1 - eio(seg(t, 1.0 + i * 0.1, 1.5 + i * 0.1));
      el.style.opacity = 0.35 * (1 - eo(seg(t, 1.7, 2.0)));
      el.style.visibility = t > 1.0 + i * 0.1 && t < 2.0 ? 'visible' : 'hidden';
    });
    fill.forEach((el, i) => {
      const s = seg(t, 1.3 + i * 0.08, 1.8 + i * 0.08), k = 1 - eo(s);
      el.style.opacity = eo(clamp01(s * 2));
      bar[i].setAttribute('transform', `translate(${(k * -7).toFixed(3)} ${(k * 10).toFixed(3)})`);
    });
    arc.style.strokeDashoffset = 1 - eo(seg(t, 2.0, 2.4));
    const n = eo(seg(t, 2.15, 2.5));
    note.style.opacity = n;
    note.setAttribute('transform', `translate(${lerp(14, 0, n)} 0)`);
    all.style.opacity = 1 - out;
  }

  // ---- play ----
  // Starts once 10% of it is in view and loops until it's fully out of view,
  // then snaps back to its first frame, so it always starts from 0. In the
  // case study's iframe the parent says
  // when ("play" / "pause"; an observer in here hears about its scrolling
  // late); opened on its own, it watches for itself.
  const root = document.documentElement;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.fonts.ready.then(() => {
    render(reduce ? ANIM : -PRE, 0);
    root.classList.add('ready');
    if (reduce) return;
    let raf = 0, on = false;
    const set = v => {
      if (v === on) return;
      on = v;
      if (v) root.classList.add('played');
      cancelAnimationFrame(raf);
      if (!v) { render(-PRE, 0); return; }
      // Time from performance.now(), not the frame timestamp: inside an
      // iframe Chrome's frame timestamp can run seconds behind it.
      const t0 = performance.now();
      const frame = () => {
        const e = ((performance.now() - t0) / 1000) % PERIOD;
        const t = e - PRE;
        const out = eio(seg(e, PRE + ANIM + HOLD, PERIOD));
        render(Math.min(t, ANIM), out);
        raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
    };
    if (self !== top) {
      addEventListener('message', e => {
        if (e.origin === location.origin && e.data && e.data.embed) set(e.data.embed === 'play');
      });
      parent.postMessage({ embed: 'ready' }, location.origin);
    } else {
      new IntersectionObserver(([en]) => set(en.isIntersecting && (on || en.intersectionRatio >= 0.1)), { threshold: [0, 0.1] }).observe(document.getElementById('fuse-loop'));
    }
  });
})();
</script>
</body>
</html>
