<script>if(self!==top)document.documentElement.classList.add('embed')</script>
<style>
@font-face{font-family:'Inter';src:url(anim/fonts/inter.woff2) format('woff2');font-weight:1 1000;font-display:block}
@font-face{font-family:'Geist Mono';src:url(anim/fonts/geist-mono.woff2) format('woff2');font-weight:1 1000;font-display:block}
@font-face{font-family:'TASA Orbiter';src:url(anim/fonts/tasa-orbiter.woff2) format('woff2');font-weight:1 1000;font-display:block}
html,body{margin:0;height:100%}
html:not(.embed){background:#0c0d0c}
body{display:grid;place-items:center;overflow:hidden}
/* Embedded in the case study, the page stays transparent until its first
   frame is drawn, so the still underneath it shows through. */
#frame{position:relative;overflow:hidden;flex:none;opacity:0;transition:opacity .4s}
/* It fades in over the still once it starts playing (with reduced motion, as
   soon as its one frame is drawn), so it never sits on its first frame. */
.ready.played #frame{opacity:1}
@media (prefers-reduced-motion: reduce){.ready #frame{opacity:1}}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#1F1F1F;--sans:'Inter', system-ui, sans-serif;--display:'TASA Orbiter', system-ui, sans-serif;--mono:'Geist Mono', ui-monospace, monospace}
#stage .scene{position:absolute;inset:0;overflow:hidden}
#stage *,#stage *::before,#stage *::after{transition:none!important;animation:none!important}
#stage { --ground:#1F1F1F; --main:#1A8754; --second:#EDEDED; --accent:#E5484D; color:var(--second); font-family:var(--sans, system-ui, sans-serif) }
.ground { position:absolute; inset:0; background:var(--ground) }
.words { position:absolute; margin:0; display:flex; flex-direction:column; gap:24px } .words > * { margin:0 }
.line { font-family:var(--display, var(--sans, system-ui, sans-serif)); font-size:84px; line-height:1.05; font-weight:600 } .sub { font-size:36px }
.mono { font-family:var(--mono, ui-monospace, monospace) }
/* One still photograph for the whole film: the tablet in hand never moves, only its screen changes. */
/* The dashboard is the product's own CSS (modules/gd.css), laid out at 1440x1078 (the tablet's 4:3) and mapped onto the screen. */
/* Product type: Inter for UI text (--sans), TASA Orbiter for titles and figures (--display), Geist Mono for labels (--mono). */
.shot-ground { position:absolute; inset:0; background:var(--ground) }
</style>

<script>
// motion-lite: the part of the Motion player's kit these films call, so each
// film runs as a plain page. Everything on screen stays a pure function of t.
(function () {
  const F = window.FILM;
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const rng = (seed) => {
    let s = seed | 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const defs = {};
  const kit = {
    W: F.w,
    H: F.h,
    stage,
    fonts: F.fonts,
    clamp01,
    clamp: (x, a, b) => Math.min(b, Math.max(a, x)),
    seg: (t, a, b) => clamp01((t - a) / (b - a)),
    lerp: (a, b, p) => a + (b - a) * p,
    smoothstep: (a, b, x) => { const p = clamp01((x - a) / (b - a)); return p * p * (3 - 2 * p); },
    eo: (x) => 1 - Math.pow(1 - clamp01(x), 3),
    ei: (x) => Math.pow(clamp01(x), 3),
    eio: (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    eob: (x, o = 1.4) => { x = clamp01(x) - 1; return 1 + (o + 1) * x * x * x + o * x * x; },
    rng,
    esc: (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]),
    el(tag, o = {}, kids = []) {
      const e = document.createElement(tag);
      if (o.class) e.className = o.class;
      if (o.style) e.style.cssText = o.style;
      if (o.text != null) e.textContent = o.text;
      if (o.html != null) e.innerHTML = o.html;
      if (o.attrs) for (const k in o.attrs) e.setAttribute(k, o.attrs[k]);
      kids.forEach((k) => e.append(k));
      return e;
    },
    h(html) {
      const t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    },
    css(text) {
      const s = document.createElement('style');
      s.textContent = text;
      this.stage.append(s);
      return s;
    },
    module: (n) => (n in F.modules ? F.modules[n] : null),
    json: (n) => JSON.parse(F.modules[n]),
    assets: {
      url: (n) => F.assets[n],
      has: (n) => n in F.assets,
      list: () => Object.keys(F.assets),
    },
    typing: { times: [] },
    // Characters land at an uneven, seeded pace, a little slower on spaces.
    typist(text, t0, cps, seed = 7) {

    score() {},
    scene(id, def) { defs[id] = def; },
    // One stage layer per scene, shown only during its span of the film.
    scenes() {
      let t = 0;
      const list = F.scenes.map((s) => { const o = { ...s, start: t }; t += s.dur; return o; });
      const duration = t;
      return {
        width: F.w,
        height: F.h,
        duration,
        init() {

            s.def = defs[s.id];
            s.root = kit.el('div', { class: 'scene' });
            stage.append(s.root);
            s.kit = Object.assign(Object.create(kit), { stage: s.root, start: s.start, dur: s.dur });
            if (s.def.init) s.def.init.call(s.def, s.kit);

        },
        render(T) {
          list.forEach((s, i) => {
            const on = T >= s.start && (T < s.start + s.dur || i === list.length - 1);
            if (s.on !== on) { s.on = on; s.root.style.display = on ? '' : 'none'; }
            if (on) s.def.render.call(s.def, T - s.start, s.kit);
          });
        },
      };
    },

    const s = Math.min(innerWidth / F.w, innerHeight / F.h);
    frame.style.width = F.w * s + 'px';
    frame.style.height = F.h * s + 'px';

      // "pause"; an observer in here hears about its scrolling late); opened on
      // its own, it watches for itself.

        // held the film on its first frame.
