<script>
// motion-lite: the part of the Motion player's kit these films call, so each
// film runs as a plain page. Everything on screen stays a pure function of t.
(function () {
  const F = window.FILM;
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const rng = (seed) => {
    let s = seed | 0;
    return () => {
      s = (s + 0x6d2b79f5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const defs = {};
  const kit = {
    W: F.w,
    H: F.h,
    stage,
    fonts: F.fonts,
    clamp01,
    clamp: (x, a, b) => Math.min(b, Math.max(a, x)),
    seg: (t, a, b) => clamp01((t - a) / (b - a)),
    lerp: (a, b, p) => a + (b - a) * p,
    smoothstep: (a, b, x) => { const p = clamp01((x - a) / (b - a)); return p * p * (3 - 2 * p); },
    eo: (x) => 1 - Math.pow(1 - clamp01(x), 3),
    ei: (x) => Math.pow(clamp01(x), 3),
    eio: (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
    eob: (x, o = 1.4) => { x = clamp01(x) - 1; return 1 + (o + 1) * x * x * x + o * x * x; },
    rng,
    esc: (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]),
    el(tag, o = {}, kids = []) {
      const e = document.createElement(tag);
      if (o.class) e.className = o.class;
      if (o.style) e.style.cssText = o.style;
      if (o.text != null) e.textContent = o.text;
      if (o.html != null) e.innerHTML = o.html;
      if (o.attrs) for (const k in o.attrs) e.setAttribute(k, o.attrs[k]);
      kids.forEach((k) => e.append(k));
      return e;
    },
    h(html) {
      const t = document.createElement('template');
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    },
    css(text) {
      const s = document.createElement('style');
      s.textContent = text;
      this.stage.append(s);
      return s;
    },
    module: (n) => (n in F.modules ? F.modules[n] : null),
    json: (n) => JSON.parse(F.modules[n]),
    assets: {
      url: (n) => F.assets[n],
      has: (n) => n in F.assets,
      list: () => Object.keys(F.assets),
    },
    typing: { times: [] },
    // Characters land at an uneven, seeded pace, a little slower on spaces.
    typist(text, t0, cps, seed = 7) {
      const r = rng(seed), times = [];
      let t = t0;
      for (const ch of text) {
        times.push(t);
        t += ((0.55 + 0.9 * r()) * (ch === ' ' || ch === '\n' ? 1.6 : 1)) / cps;
      }
      kit.typing.times.push(...times);
      const count = (tt) => { let n = 0; while (n < times.length && times[n] <= tt) n++; return n; };
      return { times, end: t, count, at: (tt) => text.slice(0, count(tt)) };
    },
    score() {},
    scene(id, def) { defs[id] = def; },
    // One stage layer per scene, shown only during its span of the film.
    scenes() {
      let t = 0;
      const list = F.scenes.map((s) => { const o = { ...s, start: t }; t += s.dur; return o; });
      const duration = t;
      return {
        width: F.w,
        height: F.h,
        duration,
        init() {
          list.forEach((s) => {
            s.def = defs[s.id];
            s.root = kit.el('div', { class: 'scene' });
            stage.append(s.root);
            s.kit = Object.assign(Object.create(kit), { stage: s.root, start: s.start, dur: s.dur });
            if (s.def.init) s.def.init.call(s.def, s.kit);
          });
        },
        render(T) {
          list.forEach((s, i) => {
            const on = T >= s.start && (T < s.start + s.dur || i === list.length - 1);
            if (s.on !== on) { s.on = on; s.root.style.display = on ? '' : 'none'; }
            if (on) s.def.render.call(s.def, T - s.start, s.kit);
          });
        },
      };
    },
  };
  const run = (name) => { if (F.modules[name] != null) new Function('kit', F.modules[name])(kit); };

  function fit() {
    const s = Math.min(innerWidth / F.w, innerHeight / F.h);
    frame.style.width = F.w * s + 'px';
    frame.style.height = F.h * s + 'px';
    stage.style.transform = 'scale(' + s + ')';
  }

  Promise.all(F.faces.map((f) => document.fonts.load(f).catch(() => {})))
    .then(() => document.fonts.ready)
    .then(() => {
      run('shared.js');
      F.scenes.forEach((s) => run('scene-' + s.id + '.js'));
      const cut = kit.scenes();
      cut.init();
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduce) return;
      // Plays from the start each time half the film is in view, and stops when
      // it leaves. In the case study's iframe the page says when ("play" /
      // "pause"; an observer in here hears about its scrolling late); opened on
      // its own, it watches for itself.
      let raf = 0, on = false;
      const set = (v) => {
        if (v === on) return;
        on = v;
        if (v) document.documentElement.classList.add('played');
        cancelAnimationFrame(raf);
        if (!v) return;
        // Time from performance.now(), not the frame timestamp: inside an
        // iframe Chrome's frame timestamp can run seconds behind it, which
        // held the film on its first frame.
        const t0 = performance.now();
        const loop = () => {
          cut.render(((performance.now() - t0) / 1000) % cut.duration);
          raf = requestAnimationFrame(loop);
        };
        raf = requestAnimationFrame(loop);
      };
      if (self !== top) {
        addEventListener('message', (e) => {
          if (e.origin === location.origin && e.data && e.data.embed) set(e.data.embed === 'play');
        });
        parent.postMessage({ embed: 'ready' }, location.origin);
      } else {
        new IntersectionObserver(([e]) => set(e.isIntersecting), { threshold: 0.5 }).observe(frame);
      }
    });
})();
