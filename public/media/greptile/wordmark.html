:root {
  --page:#060706; --ground:#0C0D0C; --main:#42C583; --second:#AEECC6; --accent:#C9E7A6; --ui:#AEECC6;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#060706; --ui:#AEECC6 } }
:root[data-theme="dark"] { --page:#060706; --ui:#AEECC6 }
*, *::before, *::after { box-sizing:inherit }
html { height:100%; scroll-padding-top:env(safe-area-inset-top, 0px) }
body { margin:0; height:100%; background:var(--page); display:grid; place-items:center; overflow:hidden }
.frame { position:relative; width:min(100vw, calc((100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)) * 16 / 9)); aspect-ratio:16 / 9; max-width:100% ; overflow:hidden; background:var(--ground) }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; color:var(--second); font-family:Geist, system-ui, sans-serif; background:var(--ground); overflow:hidden }
.tex { position:absolute; left:0; top:0; width:1920px; height:1080px }
.tex-noise { mix-blend-mode:overlay; opacity:.45 }
.art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
.wm-fill { fill:#0b4a2d }
.wm-plain { fill:color-mix(in srgb, var(--main) 95%, transparent) }
.wm-dim { fill:color-mix(in srgb, var(--main) 62%, transparent) }
.wm-key { fill:var(--second) }
.wm-str { fill:#eefbf3 }
.wm-num { fill:var(--accent) }
.wm-hlbox { fill:var(--second) }
.wm-hltext { fill:#06281b }
.gut-t { fill:#3a443d }
.gut-t-on { fill:var(--second) }
.call-line { fill:none; stroke:color-mix(in srgb, var(--second) 70%, transparent); stroke-width:1.5; stroke-linejoin:round }
.call-dot { fill:var(--second) }

   noise tile overlaid at 45%, at the frame's tile sizes scaled to 1920. The

.grid { mix-blend-mode:plus-lighter; opacity:.5 }

    S.cdots = qa('.call-dot');
    S.notes = qa('.note').map(e => e.style);
    S.fixes = qa('.note-fix').map(e => e.style);
  }

  function render(t) {
    const c = S.ctx, col = S.col, s = travel(t);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.globalAlpha = 1;
    c.clearRect(0, 0, 1920, 1080);
    c.fillStyle = col[0];
    c.fillRect(150, 200, 1660, 700);
    c.font = S.MONO;
    c.textBaseline = 'alphabetic';
    for (const r of S.rows) {
      const y = BASE + ROW * r.j + 21 + s;
      if (y < 230 || y > 900) continue;
      for (const g of r.segs) { c.fillStyle = col[g.c]; c.fillText(g.s, g.x, y); }
    }
    const amt = S.hls.map(o => eio(seg(t, o.a, o.a + 0.9)) * (1 - eio(seg(t, o.b - 0.8, o.b))));
    S.hls.forEach((o, n) => {
      if (amt[n] <= 0) return;
      const h = o.h, top = BASE + ROW * h.j - 3 + s;
      const w = (h.w + 10) * eio(seg(t, o.a, o.a + 1.0));
      c.globalAlpha = amt[n];
      c.fillStyle = col[6];
      c.fillRect(h.x1 - 5, top, w, 29);
      c.save(); c.beginPath(); c.rect(h.x1 - 5, top, w, 29); c.clip();
      c.fillStyle = col[7]; c.fillText(h.word, h.x1, top + 24);
      c.restore();
      c.globalAlpha = 1;
    });
    c.globalCompositeOperation = 'destination-in';
    c.setTransform(DPR * K, 0, 0, DPR * K, DPR * WMX, DPR * WMY);
    c.fillStyle = '#000';
    c.fill(WMP);
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.globalCompositeOperation = 'source-over';
    c.font = S.GUT;
    for (const r of S.rows) {
      const y = BASE + ROW * r.j + 18 + s;
      const f = clamp01((y - 262) / 40) * clamp01((790 - y) / 30);
      if (f <= 0) continue;
      const lab = String(214 + r.j).padStart(4, '0');
      c.globalAlpha = f; c.fillStyle = col[8]; c.fillText(lab, 42.08, y);
      const hs = S.hot[r.j];
      if (hs) { const a = Math.max(...hs.map(n => amt[n])); if (a > 0) { c.globalAlpha = f * a; c.fillStyle = col[9]; c.fillText(lab, 42.08, y); } }
    }
    c.globalAlpha = 1;
    POPS.forEach((p, n) => {
      const st = S.notes[n], path = S.calls[n], ring = S.rings[n], dot = S.cdots[n];
      if (!p.hl) { st.opacity = 0; path.setAttribute('opacity', '0'); ring.setAttribute('opacity', '0'); dot.setAttribute('opacity', '0'); return; }
      const ax = p.hl.ax, ay = BASE + ROW * p.hl.j + (p.up ? -3 : 26) + s;
      const ex = ax + p.dir * Math.abs(p.ey - ay);
      const L = Math.hypot(ex - ax, p.ey - ay) + Math.abs(p.attach - ex);
      const draw = eio(seg(t, p.t0, p.t0 + 1.0)) * (1 - eio(seg(t, p.t1 - 0.7, p.t1)));
      path.setAttribute('d', 'M' + ax.toFixed(2) + ' ' + ay.toFixed(2) + ' L' + ex.toFixed(2) + ' ' + p.ey + ' L' + p.attach.toFixed(2) + ' ' + p.ey);
      path.setAttribute('stroke-dasharray', L.toFixed(2) + ' ' + (L + 10).toFixed(2));
      path.setAttribute('stroke-dashoffset', (L * (1 - draw)).toFixed(2));
      path.setAttribute('opacity', draw > 0 ? '1' : '0');
      const dOn = eio(seg(t, p.t0 - 0.4, p.t0 + 0.1)) * (1 - eio(seg(t, p.t1 - 0.35, p.t1)));
      dot.setAttribute('cx', ax.toFixed(2)); dot.setAttribute('cy', ay.toFixed(2)); dot.setAttribute('opacity', dOn.toFixed(3));
      const rp = seg(t, p.t0 - 0.1, p.t0 + 1.2);
      ring.setAttribute('cx', ax.toFixed(2)); ring.setAttribute('cy', ay.toFixed(2));
      ring.setAttribute('r', lerp(4, 12, eo(rp)).toFixed(2));
      ring.setAttribute('opacity', (rp > 0 && rp < 1 ? 0.45 * (1 - eio(rp)) : 0).toFixed(3));
      const pin = eio(seg(t, p.t0 + 0.7, p.t0 + 1.6)), pout = eio(seg(t, p.t1 - 1.0, p.t1 - 0.4));
      const vy = p.up ? 1 : -1;
      st.opacity = (pin * (1 - pout)).toFixed(3);
      st.transform = 'translate(' + (-p.dir * 5 * (1 - pin)).toFixed(2) + 'px,' + (vy * 4 * (1 - pin) - vy * 2 * pout).toFixed(2) + 'px)';
      const fp = eio(seg(t, p.t0 + 1.3, p.t0 + 2.0));
      S.fixes[n].opacity = fp.toFixed(3);
      S.fixes[n].clipPath = 'inset(0 ' + ((1 - fp) * 100).toFixed(1) + '% 0 0)';
    });
  }

  const btn = document.getElementById('toggle');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, clock = reduce ? 2.6 : 0, last = null;
  function setBtn() { btn.textContent = playing ? 'Pause' : 'Play'; btn.setAttribute('aria-pressed', String(!playing)); btn.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation'); }
  btn.addEventListener('click', () => { playing = !playing; last = null; setBtn(); });

  let raf = 0;
  function frameLoop(now) {
    if (playing) {
      if (last !== null) clock = (clock + (now - last) / 1000) % DUR;
      last = now;
    }
    render(clock);
    raf = requestAnimationFrame(frameLoop);
  }

  // Plays from the start each time half the frame is in view, and stops when
  // it leaves. In the case study's iframe the page says when ("play" /
  // "pause"; an observer in here hears about its scrolling late); opened on
  // its own, it watches for itself.
  function playOnView() {
    let on = false;
    const set = (v) => {
      if (v === on) return;
      on = v;
      if (v) document.documentElement.classList.add('played');
      cancelAnimationFrame(raf);
      if (!v) return;
      if (!reduce) clock = 0;
      last = null;
      raf = requestAnimationFrame(frameLoop);
    };
    if (self !== top) {
      addEventListener('message', (e) => {
        if (e.origin === location.origin && e.data && e.data.embed) set(e.data.embed === 'play');
      });
      parent.postMessage({ embed: 'ready' }, location.origin);
    } else {
      new IntersectionObserver(([e]) => set(e.isIntersecting), { threshold: 0.5 }).observe(frame);
    }
  }

  Promise.all([
    document.fonts.load("400 21.7px 'Geist Mono'"),
    document.fonts.load("500 14.5px 'Geist Mono'"),
    document.fonts.load('500 548px Geist')
  ]).catch(() => {}).then(() => document.fonts.ready).then(() => {
    fit();
    addEventListener('resize', fit);
    init();
    setBtn();
    render(clock);
    document.documentElement.classList.add('ready');
    playOnView();
  });
})();
</script>
</body>
</html>
